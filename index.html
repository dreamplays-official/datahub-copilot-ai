<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataHub Copilot - AI Demo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0073e6; margin-top: 0; }
        .chat-box { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; height: 350px; overflow-y: auto; background: #fafafa; margin-bottom: 15px; }
        .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 14px; }
        .user { background: #0073e6; color: white; margin-left: auto; text-align: right; }
        .bot { background: #e9ecef; color: #212529; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { padding: 12px 20px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        pre { background: #1e1e1e; color: #00ff66; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; text-align: left; margin: 5px 0 0 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 DataHub Copilot Live Assistant</h1>
    <p>Ask anything about your database in plain English!</p>

    <div class="chat-box" id="chatBox">
        <div class="msg bot">👋 Hi! I am DataHub Copilot. Type your query (e.g., "Show top 10 best data", "Find active users", etc.)</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="e.g., Show top 10 best data..." value="Show top 10 best data">
        <button onclick="sendMessage()">Send 🚀</button>
    </div>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("userInput");
    let chatBox = document.getElementById("chatBox");
    let query = input.value.trim();

    if (query === "") return;

    // Show User Message
    chatBox.innerHTML += `<div class="msg user">${query}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // Typing Status
    let loadingId = "load_" + Date.now();
    setTimeout(() => {
        chatBox.innerHTML += `<div class="msg bot" id="${loadingId}">🔍 <i>Fetching DataHub schema context for: "${query}"...</i></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 400);

    // Smart Dynamic Response Generator
    setTimeout(() => {
        let loadElem = document.getElementById(loadingId);
        if (loadElem) loadElem.remove();

        let lowerQ = query.toLowerCase();
        let limit = 5;
        let numbers = query.match(/\d+/);
        if (numbers) limit = numbers[0];

        let tableName = "zava_analytics.enterprise_datasets";
        let targetCol = "*";

        if (lowerQ.includes("product") || lowerQ.includes("item")) {
            tableName = "zava_analytics.products_v2";
            targetCol = "product_name, category, revenue";
        } else if (lowerQ.includes("user") || lowerQ.includes("customer")) {
            tableName = "zava_analytics.active_users";
            targetCol = "user_id, username, created_at";
        } else if (lowerQ.includes("sales") || lowerQ.includes("revenue")) {
            tableName = "zava_analytics.monthly_sales";
            targetCol = "sale_id, amount, date";
        }

        let sqlResponse = `
<pre>-- Generated dynamically by DataHub Copilot
-- Intent: ${query}
SELECT ${targetCol}
FROM ${tableName}
WHERE status = 'Active'
ORDER BY updated_at DESC
LIMIT ${limit};</pre>`;

        chatBox.innerHTML += `<div class="msg bot">✅ <b>Zero-Hallucination SQL:</b>${sqlResponse}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 1200);
}
</script>

</body>
</html>
