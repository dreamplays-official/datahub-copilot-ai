<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataHub Copilot - AI Demo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0073e6; margin-top: 0; }
        .chat-box { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; height: 320px; overflow-y: auto; background: #fafafa; margin-bottom: 15px; }
        .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 14px; }
        .user { background: #0073e6; color: white; margin-left: auto; text-align: right; }
        .bot { background: #e9ecef; color: #212529; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { padding: 12px 20px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        pre { background: #1e1e1e; color: #00ff66; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 DataHub Copilot Live Assistant</h1>
    <p>Ask anything about your database in plain English!</p>

    <div class="chat-box" id="chatBox">
        <div class="msg bot">👋 Hi! I am DataHub Copilot. Ask me a question about your datasets!</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="e.g., Show top 5 active products..." value="Show top 5 active products">
        <button onclick="sendMessage()">Send 🚀</button>
    </div>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("userInput");
    let chatBox = document.getElementById("chatBox");
    let query = input.value.trim();

    if (query === "") return;

    // User Message
    chatBox.innerHTML += `<div class="msg user">${query}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // Bot Typing Effect
    setTimeout(() => {
        chatBox.innerHTML += `<div class="msg bot">🔍 <i>Reading DataHub metadata context...</i></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 500);

    // Bot Output
    setTimeout(() => {
        let sqlResponse = `
<pre>-- Generated by DataHub Copilot
SELECT product_name, category, SUM(revenue) AS total_revenue
FROM zava_analytics.products_v2
WHERE status = 'Active'
GROUP BY product_name, category
ORDER BY total_revenue DESC LIMIT 5;</pre>`;
        chatBox.innerHTML += `<div class="msg bot">✅ <b>Zero-Hallucination SQL:</b>${sqlResponse}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 1500);
}
</script>

</body>
</html>
